# Type definitions related to geometry and coordinates

# 3D coordinates (in mm)
# coordinates are given in the order (x, y, z). PETSIRD follows the
# NEMA Standard 10-16-1985, section 5.2.5 Coordinate Systems with the
# added restriction that it is a right-handed coordinate system.
#
# 5.2.5.1 INTRODUCTION
# Image locations and orientations are specified with respect to equipment
# based coordinate systems. [...]
#
# The definitions of coordinate frames should be based on CT and MR modalities.
#
# 5.2.5.2 AXIS DEFINITION
#
# An imaging device shall have a manufacturer-defined front and back identified
# for its gantry. When facing the front of the gantry, and with the gantry in a
# neutral (untilted) position, the x-axis shall be increasing to the right;
# the y-axis shall be increasing down (defined by gravitational attraction);
# and the z-axis shall be defined as the line orthogonal to x and y, with
# increasing values from the front to the back of the gantry.
Coordinate: !record
  fields:
    c: float[3]

# 3D direction vector (normalized to 1)
Direction: !record
  fields:
    c: float[3]

# Orthonormal matrix
# direction_of_first_axis = matrix * [1, 0 ,0] (as a column vector)
DirectionMatrix: !record
  fields:
    matrix: float[3, 3]

# Rigid transformation, encoded via homogeneous transformation
# transformed_coord = matrix * [c, 1] (where [c,1] is a column vector)
# with `c` of type `Coordinate`
RigidTransformation: !record
  fields:
    matrix: float[3, 4]

# A list of identical objects at different locations
ReplicatedObject<T>: !record
  fields:
    object: T
    # list of transforms
    # Constraint: length >= 1
    transforms: RigidTransformation*
  computedFields:
    numberOfObjects: size(transforms)

# A box-shape specified by 8 corners (e.g. cuboid, wedge, etc.)
# The actual shape should be considered to be the convex hull of the 8 vertices.
# Constraints:
# - First 4 vertices specify the front face (i.e. closest to the scanner axis/centre).
# - Last 4 vertices specify the back face (i.e. furthest to the scanner axis/centre).
# - The first vertex of the front/back face has to be "smaller" than the other vertices
#   of that face (i.e. its coordinates have to be less in lexicographical order).
# - The box "direction" is inferred from "centre of front face" to "centre of back face"
# - Order of vertices within the front/back face: clock-wise (around direction axis).
BoxShape: !record
  fields:
    corners: Coordinate*8

# Annulus of certain thickness centered at [0,0,0] and oriented along the [0,0,1] axis
# in radians. An angle of 0 corresponds to the [1,0,0] axis, Pi/2 corresponds to the [0,1,0] axis.
AnnulusShape: !record
  fields:
    # inner radius (in mm)
    innerRadius: float
    # outer radius (in mm)
    outerRadius: float
    # thickness of the annulus, i.e. length along the axis (in mm)
    thickness: float
    # start-stop angle (in radians)
    angularRange: float*2
    # center point of the cylinder defining the annulus

# Union of all possible shapes
GeometricShape: [BoxShape, AnnulusShape]
